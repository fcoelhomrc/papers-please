<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
  <title>Papers Please</title>
  <script>
    // Applied before first paint: without this the page renders light, then
    // flips to dark once React mounts the ThemeProvider.
    (function () {
      try {
        var mode = localStorage.getItem('pp-theme') || 'system'
        var dark = mode === 'dark' || (mode === 'system' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
      } catch (e) { /* private mode / storage blocked - fall back to light */ }
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
