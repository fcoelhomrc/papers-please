server {
    listen 80;

    # Hashed filenames, so the content at a given URL never changes - cache
    # them for a year and let a new build simply reference a new name.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html is the one file whose URL is stable while its content
        # changes, and it names the hashed bundle. Cached, it pins the
        # browser to a build that no longer exists on disk - the page loads
        # from cache and a newly shipped route is simply absent, with no
        # error to explain it. Nothing was setting this, so the browser was
        # free to heuristically cache it.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
