database:
  host: db

storage:
  # Must match compose.yaml's papers_data volume mount point (/data). A
  # relative path here resolves against /app, which is bind-mounted to the
  # host repo for live-reload - PDFs would land on disk in the repo instead
  # of the named volume, bypassing "tear down and nuke volumes" cleanup.
  root: /data

devices:
  # Only the chunker gets the GPU. OCR is the ingest bottleneck - Docling on
  # CPU is minutes per PDF - and Docling's layout/table models alone take
  # ~2.2GB of the 4GB card.
  #
  # The embedder was on cuda for one run and OOM'd every pass: bge-small
  # could not get 2MB alongside Docling, so the embed worker crashed, was
  # restarted by compose, and embeddings sat at 616 while chunks climbed past
  # 1200. It costs nothing to move back - bge-small on CPU is ~13s per 1,000
  # chunks against hours of OCR. Same reasoning for the reranker, which also
  # runs per search request on the long-lived backend.
  chunker: cuda
  embedder: cpu
  reranker: cpu

embedder:
  model: bge-small
  max_tokens: 256          # small chunks embed sharper; context comes from neighbour_window
  max_chunks: 1000

search:
  top_k: 10
  rerank_top_k: 5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  mode: hybrid            # semantic | keyword | hybrid
  corpus: eval            # documents.corpus retrieval may see (null = all)
  namespace: eval         # Pinecone namespace; must match corpus
  keyword_weight: 0.1     # keyword's RRF weight relative to dense retrieval's 1.0
  rerank_candidates: 40   # pool retrieved before the cross-encoder cuts to top_k
  neighbour_window: 1     # chunks either side glued on as context after ranking (0 = off)
  min_rerank_score: -8.0  # cross-encoder logits, ms-marco-MiniLM specific

stages:
  download:
    interval_s: 10
    limit: 20
    workers: 4
    max_attempts: 3       # give up on a URL after this many failed downloads
  chunk:
    interval_s: 10
    limit: 10
  embed:
    interval_s: 10
    limit: 500

llm:
  # OpenRouter: one OpenAI-compatible endpoint fronting every provider, so
  # switching models is editing this file rather than editing llm.py.
  # Set provider: anthropic to go direct to Claude instead (still supported).
  provider: openrouter
  # `vendor/model`, with `:free` selecting the free tier. Free models are
  # rate limited hard - fine for the app, not enough for a 50-question
  # judged eval on a free-tier account. See the README.
  model: minimax/minimax-m2.7:free
  # The judge, pinned separately from `model`. Must NOT be the pipeline
  # model - a model grading its own output is self-preference bias. Scores
  # identically to the old claude-haiku-4.5 judge at 1/15th the cost; see
  # docs/judge-model-selection.md for the measurements.
  judge_model: deepseek/deepseek-v4-flash
  # Writes the test set. A third distinct family, so nothing across the
  # evaluation grades its own output: glm asks, minimax answers, deepseek
  # scores. Not a :free model - the KG build is ~1,600 calls against a
  # 1,000/day free-tier cap.
  generator_model: z-ai/glm-5.3-flash
