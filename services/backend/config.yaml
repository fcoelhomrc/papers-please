database:
  host: db

storage:
  # Must match compose.yaml's papers_data volume mount point (/data). A
  # relative path here resolves against /app, which is bind-mounted to the
  # host repo for live-reload - PDFs would land on disk in the repo instead
  # of the named volume, bypassing "tear down and nuke volumes" cleanup.
  root: /data

devices:
  chunker: cpu
  embedder: cpu
  reranker: cpu

embedder:
  model: bge-small
  max_tokens: 512
  max_chunks: 1000

search:
  top_k: 10
  rerank_top_k: 5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

stages:
  download:
    interval_s: 10
    limit: 20
    workers: 4
  chunk:
    interval_s: 10
    limit: 10
  embed:
    interval_s: 10
    limit: 500
