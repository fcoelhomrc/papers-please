services:
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"  # dashboard - http://localhost:6006
      - "4317:4317"  # OTLP grpc collector
    volumes:
      - phoenix_data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Lisbon
      PGTZ: Europe/Lisbon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    image: papers-please-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
      # Read-only view of the container runtime so GET /workers can report
      # whether the stage workers are up. :ro matters - the API only reads,
      # and a writable socket would be control over every container on the
      # host from a web request.
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman.sock:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Lets GET /workers report whether the stage workers are running.
      # Read-only, and the API only ever reads - see services/backend/containers.py.
      DOCKER_HOST: unix:///run/podman.sock
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-papers-please}
      # Set to 1 to run the agent from recorded fixtures in eval/replay/
      # instead of calling an LLM - the chat panel works end to end with no
      # API key and no tokens spent. Empty (the default) means normal mode.
      PAPERS_PLEASE_REPLAY: ${PAPERS_PLEASE_REPLAY:-}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    command: python -m uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  worker-download:
    image: papers-please-backend:latest
    restart: unless-stopped
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m stages.download

  worker-chunk:
    image: papers-please-backend:latest
    restart: unless-stopped
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m stages.chunk

  worker-embed:
    image: papers-please-backend:latest
    restart: unless-stopped
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m stages.embed

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  papers_data:
  backend_venv:
  phoenix_data:
