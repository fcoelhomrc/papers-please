services:
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"  # dashboard - http://localhost:6006
      - "4317:4317"  # OTLP grpc collector
    volumes:
      - phoenix_data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Lisbon
      PGTZ: Europe/Lisbon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    image: papers-please-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    command: python -m uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  worker-download:
    image: papers-please-backend:latest
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m stages.download

  worker-chunk:
    image: papers-please-backend:latest
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m stages.chunk

  worker-embed:
    image: papers-please-backend:latest
    volumes:
      - papers_data:/data
      - ./services/backend:/app
      - backend_venv:/app/.venv
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m stages.embed

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  papers_data:
  backend_venv:
  phoenix_data:
